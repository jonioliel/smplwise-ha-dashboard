name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build HACS archive
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/smplwise-ha-dashboard.zip
          --verify-tag
          --title "SmplWise HA Dashboard ${{ github.ref_name }}"
          --generate-notes
